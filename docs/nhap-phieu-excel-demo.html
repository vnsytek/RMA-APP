<title>Nhập phiếu từ báo giá Excel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
    /* Layout: three steps of one import (file → preview → result), notes in a side column. */
    :root {
        --brand: #1f4a3d; --brand-hover: #24574a; --brand-soft: #e2ede7;
        --canvas: #f2f4f1; --surface: #ffffff; --panel: #f7f8f6; --line: #d8dfda;
        --ink: #16211c; --muted: #5b6a62; --on-brand: #ffffff;
        --err-bg: #fbe7e5; --err-ink: #9b2c22; --warn-bg: #fdf1dc; --warn-ink: #8a5300; --info-bg: #e6eff8; --info-ink: #1d4f7a; --ok-bg: #e3f3ea; --ok-ink: #17603f;
        --sans: 'Be Vietnam Pro', ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            color-scheme: dark;
            --brand: #6fb99b; --brand-hover: #86c9ad; --brand-soft: #1d3129; --canvas: #111714; --surface: #18201c; --panel: #1d2621; --line: #2c3a33;
            --ink: #e4ece7; --muted: #9aaca2; --on-brand: #0e1512;
            --err-bg: #3a1c19; --err-ink: #f3a39a; --warn-bg: #33270f; --warn-ink: #f1c878; --info-bg: #16283a; --info-ink: #9cc6ee; --ok-bg: #173226; --ok-ink: #8fd6b1;
        }
    }
    :root[data-theme="dark"] {
        color-scheme: dark;
        --brand: #6fb99b; --brand-hover: #86c9ad; --brand-soft: #1d3129; --canvas: #111714; --surface: #18201c; --panel: #1d2621; --line: #2c3a33;
        --ink: #e4ece7; --muted: #9aaca2; --on-brand: #0e1512;
        --err-bg: #3a1c19; --err-ink: #f3a39a; --warn-bg: #33270f; --warn-ink: #f1c878; --info-bg: #16283a; --info-ink: #9cc6ee; --ok-bg: #173226; --ok-ink: #8fd6b1;
    }
    * { box-sizing: border-box; }
    body { background: var(--canvas); color: var(--ink); font: 14px/1.55 var(--sans); padding-inline: 16px; padding-block: 24px 48px; }
    .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
    h1, h2, h3 { margin: 0; text-wrap: balance; } h1 { font-size: 24px; } h2 { font-size: 16px; font-weight: 600; }
    h3 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    p { margin: 0; } .muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: var(--mono); }
    .tag { display: inline-flex; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--brand-soft); color: var(--brand); }
    .intro { max-width: 72ch; color: var(--muted); margin-top: 4px; }
    .steps { display: flex; flex-wrap: wrap; gap: 8px; }
    .steps button { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; }
    .steps button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
    @media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
    .note { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; font-size: 13px; }
    .note ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .field { display: grid; gap: 4px; } .field > span { font-size: 12px; font-weight: 600; }
    input, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
    .btn { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); } .btn:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .file { display: flex; align-items: center; gap: 12px; border: 1px dashed var(--line); border-radius: 8px; padding: 12px 14px; background: var(--panel); }
    .file b { font-family: var(--mono); font-size: 13px; }
    .detect { border-radius: 8px; padding: 10px 12px; font-size: 13px; background: var(--ok-bg); }
    .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1080px; }
    th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr.skip td { opacity: .45; }
    td input { padding: 5px 7px; }
    .flags { display: grid; gap: 3px; margin-top: 4px; }
    .flag { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 600; }
    .flag.err { background: var(--err-bg); color: var(--err-ink); } .flag.warn { background: var(--warn-bg); color: var(--warn-ink); } .flag.info { background: var(--info-bg); color: var(--info-ink); }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
    .summary span { border-radius: 999px; padding: 3px 10px; background: var(--panel); border: 1px solid var(--line); }
    .result li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
    .result li:first-child { border-top: 0; }
    .result ul { list-style: none; margin: 0; padding: 0; }
</style>

<div class="wrap">
    <header>
        <span class="tag">Demo · chưa làm vào hệ thống · dữ liệu lấy từ file thật</span>
        <h1 style="margin-top:8px">Nhập nhiều phiếu từ báo giá Excel</h1>
        <p class="intro">File <span class="mono">QT-PVN-IT-Repair-30_09_2026.xlsx</span> là báo giá Sang Y gửi Pegatron, có 5 thiết bị. Hệ thống đọc file, cho xem và sửa từng dòng, rồi tạo mỗi máy một phiếu.</p>
    </header>

    <nav class="steps" role="tablist" id="steps"></nav>

    <div class="layout">
        <main id="stage" aria-live="polite"></main>
        <aside class="note" id="aside"></aside>
    </div>
</div>

<script>
// Rows exactly as the prototype parser read them from the real file.
const PARSED = [
    { no: 1, type: 'Máy tính xách tay', brand: 'ASUS', model: 'UX533FAC', serial: 'PL6OACV00001061', months: 3, fault: 'Hỏng bản lề, thay bản lề mới (mặt C)', date: '30/09/2026' },
    { no: 2, type: 'Máy tính xách tay', brand: 'ASUS', model: 'X512J', serial: 'PL6OACV00001061', months: null, fault: 'Bị hỏng bản lề + màn hình, thay bản lề + màn hình', date: '30/09/2026' },
    { no: 3, type: 'Mainboard', brand: 'ASUS', model: 'PRIME Z790-P WIFI', serial: 'T7M0CS07Y471F57', months: 3, fault: 'Hỏng linh kiện trên Main', date: '30/09/2026' },
    { no: 4, type: 'Mainboard', brand: 'ASUS', model: 'PRIME Z790-P WIFI', serial: 'R8MOCS05S7053UK', months: 3, fault: 'Hỏng linh kiện trên Main', date: '30/09/2026' },
    { no: 5, type: 'Máy tính để bàn', brand: 'ASUS', model: 'DC700MC', serial: '1PFCG01683904', months: 3, fault: 'Tình trạng hỏng main, thay main mới', date: '30/09/2026' },
];
const KNOWN_TYPES = ['Máy tính xách tay', 'Máy tính để bàn', 'Màn hình', 'Máy in', 'Bộ nguồn', 'Tivi', 'MINI PC'];
const KNOWN_MODELS = ['P500MV', 'Asus27V', 'CA123', 'D7001MF'];

const state = {
    step: 'file',
    rows: PARSED.map((row) => ({ ...row, include: true })),
    contactPhone: '',
    created: [],
};

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function flags(row, index) {
    const out = [];
    if (!row.serial.trim()) out.push(['err', 'Thiếu serial']);
    const twin = state.rows.findIndex((other, i) => i !== index && other.include && other.serial.trim() && other.serial.trim().toUpperCase() === row.serial.trim().toUpperCase());
    if (twin !== -1) out.push(['err', `Trùng serial với dòng ${state.rows[twin].no}`]);
    if (!row.fault.trim()) out.push(['err', 'Thiếu lỗi khách báo']);
    if (!row.months) out.push(['warn', 'Chưa có số tháng BH']);
    if (!KNOWN_TYPES.includes(row.type)) out.push(['info', `Loại mới "${row.type}" sẽ được tạo`]);
    if (!KNOWN_MODELS.includes(row.model)) out.push(['info', 'Model mới, sẽ được tạo']);
    return out;
}

const blocking = (row, i) => row.include && flags(row, i).some(([level]) => level === 'err');
const ready = () => state.rows.filter((row, i) => row.include && !blocking(row, i));

function renderFile() {
    return `<section class="card">
        <h2>Bước 1 · Chọn file và thông tin chung</h2>
        <div class="file"><div><b>QT-PVN-IT-Repair-30_09_2026.xlsx</b><div class="small muted">Báo giá thiết bị · 5 dòng · ngày 30/09/2026</div></div></div>
        <div class="detect">Đọc từ đầu file: <b>To: PEGATRON</b> → khớp khách <b>CÔNG TY TNHH PEGATRON VIỆT NAM</b> (MST 0202019370) · <b>Co: BEN DANG</b> → người liên hệ.</div>
        <div class="grid">
            <label class="field"><span>Khách gửi máy *</span><select id="f-customer"><option>CÔNG TY TNHH PEGATRON VIỆT NAM · MST 0202019370</option></select></label>
            <label class="field"><span>Người liên hệ *</span><select id="f-contact"><option>+ Người liên hệ mới: BEN DANG</option></select></label>
            <label class="field"><span>SĐT của BEN DANG * <span class="muted" style="font-weight:400">(file không có)</span></span><input id="f-phone" inputmode="tel" placeholder="VD: 0901 234 567" value="${esc(state.contactPhone)}"></label>
            <label class="field"><span>Hình thức</span><select id="f-kind"><option>Sửa chữa · Hết bảo hành</option></select></label>
            <label class="field"><span>Nhân viên phụ trách</span><select id="f-tech"><option>Kha</option></select></label>
        </div>
        <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" type="button" data-go="preview">Đọc file → xem trước</button></div>
    </section>`;
}

function renderPreview() {
    const rows = state.rows.map((row, i) => {
        const list = flags(row, i);
        return `<tr class="${row.include ? '' : 'skip'}">
            <td><input type="checkbox" data-include="${i}" ${row.include ? 'checked' : ''} aria-label="Tạo phiếu cho dòng ${row.no}" style="width:16px;height:16px;accent-color:var(--brand)"></td>
            <td class="mono">${row.no}</td>
            <td><input data-edit="${i}" data-field="type" value="${esc(row.type)}" aria-label="Loại dòng ${row.no}"></td>
            <td><input data-edit="${i}" data-field="brand" value="${esc(row.brand)}" aria-label="Hãng dòng ${row.no}" style="width:70px"></td>
            <td><input data-edit="${i}" data-field="model" value="${esc(row.model)}" aria-label="Model dòng ${row.no}"></td>
            <td><input class="mono" data-edit="${i}" data-field="serial" value="${esc(row.serial)}" aria-label="Serial dòng ${row.no}"></td>
            <td><input data-edit="${i}" data-field="fault" value="${esc(row.fault)}" aria-label="Lỗi dòng ${row.no}" style="min-width:230px"></td>
            <td><input type="number" min="1" max="60" data-edit="${i}" data-field="months" value="${row.months ?? ''}" aria-label="Bảo hành dòng ${row.no}" style="width:64px"></td>
            <td class="small">${row.date}</td>
            <td><div class="flags">${list.map(([level, text]) => `<span class="flag ${level}">${esc(text)}</span>`).join('') || '<span class="flag info">OK</span>'}</div></td>
        </tr>`;
    }).join('');
    const ok = ready().length;
    const errors = state.rows.filter((row, i) => blocking(row, i)).length;

    return `<section class="card">
        <div class="row" style="justify-content:space-between"><h2>Bước 2 · Kiểm tra từng dòng</h2><span class="small muted">Sửa trực tiếp trong bảng; bỏ tick dòng không muốn tạo</span></div>
        <div class="summary"><span><b>${ok}</b> phiếu sẵn sàng</span>${errors ? `<span style="background:var(--err-bg);color:var(--err-ink)"><b>${errors}</b> dòng cần sửa</span>` : ''}<span>Tạo mới: loại <b>Mainboard</b>, 4 model ASUS, người liên hệ <b>BEN DANG</b></span></div>
        <div class="table-scroll"><table>
            <thead><tr><th></th><th>#</th><th>Loại</th><th>Hãng</th><th>Model</th><th>Serial</th><th>Lỗi khách báo</th><th>BH sau sửa (th)</th><th>Ngày nhận</th><th>Kiểm tra</th></tr></thead>
            <tbody>${rows}</tbody>
        </table></div>
        <div class="row" style="justify-content:space-between">
            <button class="btn" type="button" data-go="file">← Quay lại</button>
            <button class="btn btn-primary" type="button" data-create ${ok ? '' : 'disabled'}>Tạo ${ok} phiếu</button>
        </div>
    </section>`;
}

function renderResult() {
    const items = state.created.map((row) => `<li>
        <b class="mono">${row.ticket}</b><span>${esc(row.brand)} ${esc(row.model)} · <span class="mono">${esc(row.serial)}</span></span>
        <span class="flag warn">Chưa có ảnh lúc nhận máy</span>
        <span class="small muted">BH sau sửa dự kiến: ${row.months ? row.months + ' tháng' : 'chưa nhập'}</span>
    </li>`).join('');
    const skipped = state.rows.length - state.created.length;

    return `<section class="card result">
        <h2>Bước 3 · Đã tạo ${state.created.length} phiếu cho Pegatron</h2>
        <ul>${items}</ul>
        ${skipped ? `<p class="small muted">${skipped} dòng không tạo (bỏ tick hoặc còn lỗi). Sửa lại rồi nhập tiếp được.</p>` : ''}
        <div class="detect" style="background:var(--warn-bg)">Các phiếu này <b>chưa có ảnh lúc nhận máy</b>. Bấm "Bắt đầu kiểm tra" sẽ bị chặn cho đến khi tải ảnh lên, để đúng quy định chụp ảnh lúc nhận.</div>
        <div class="row" style="justify-content:space-between">
            <button class="btn" type="button" data-go="preview">← Xem lại bảng</button>
            <button class="btn" type="button" disabled>In phiếu nhận (mỗi máy 1 phiếu)</button>
        </div>
    </section>`;
}

const ASIDE = {
    file: `<h3>Bước 1</h3><ul>
        <li>Khách và người liên hệ đọc từ đầu file (<b>To</b>, <b>Co</b>), đổi được nếu sai.</li>
        <li>Người liên hệ mới cần SĐT; file báo giá không có nên nhập ở đây một lần.</li>
        <li>Hình thức và người phụ trách áp dụng cho cả file.</li></ul>`,
    preview: `<h3>Bước 2 · file thật có 2 lỗi</h3><ul>
        <li><b>Dòng 2 trùng serial với dòng 1</b> (<span class="mono">PL6OACV00001061</span>), có thể do copy. Sửa serial dòng 2 thì dòng đó hết lỗi.</li>
        <li>Dòng 2 <b>chưa có số tháng BH</b> ("BH:  THÁNG"). Chỉ là cảnh báo, vẫn tạo được.</li>
        <li>"BH 03 tháng" được lưu làm <b>bảo hành sau sửa dự kiến</b>, tự điền sẵn ở bước "Sửa xong".</li>
        <li>Phần tiếng Trung trong mô tả được bỏ qua.</li></ul>
        <p class="small muted">Thử sửa serial dòng 2, hoặc bỏ tick, rồi bấm Tạo phiếu.</p>`,
    result: `<h3>Sau khi tạo</h3><ul>
        <li>Mỗi máy 1 phiếu, số liên tiếp.</li>
        <li>Model, loại, người liên hệ mới được thêm vào danh mục và danh bạ.</li>
        <li>Máy nào đã từng gửi hoặc còn BH sửa chữa sẽ được báo ở bước 2.</li></ul>`,
};

function render() {
    document.getElementById('steps').innerHTML = [['file', '1. Chọn file'], ['preview', '2. Xem trước'], ['result', '3. Kết quả']]
        .map(([id, label]) => `<button type="button" role="tab" data-go="${id}" aria-selected="${state.step === id}" ${id === 'result' && !state.created.length ? 'disabled' : ''}>${label}</button>`).join('');
    document.getElementById('stage').innerHTML = { file: renderFile, preview: renderPreview, result: renderResult }[state.step]();
    document.getElementById('aside').innerHTML = ASIDE[state.step];
}

document.addEventListener('click', (event) => {
    const go = event.target.closest('[data-go]');
    if (go && !go.disabled) { state.step = go.dataset.go; render(); }
    if (event.target.closest('[data-create]')) {
        let next = 1;
        state.created = ready().map((row) => ({ ...row, ticket: '2609000' + next++ }));
        state.step = 'result';
        render();
    }
});

document.addEventListener('change', (event) => {
    const t = event.target;
    if (t.matches('[data-include]')) { state.rows[Number(t.dataset.include)].include = t.checked; render(); }
    if (t.matches('[data-edit]')) {
        const row = state.rows[Number(t.dataset.edit)];
        row[t.dataset.field] = t.dataset.field === 'months' ? (Number(t.value) || null) : t.value;
        render();
    }
});

document.addEventListener('input', (event) => {
    if (event.target.id === 'f-phone') state.contactPhone = event.target.value;
});

render();
</script>
