<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f2f4f1; --surface: #ffffff; --surface-2: #f7f8f6; --text: #16211c; --muted: #5b6a62;
    --border: #d8dfda; --accent: #1f4a3d; --accent-ink: #ffffff; --accent-soft: #e2ede7;
    --side: #173a30; --side-text: #d5e4dc; --side-muted: #86a497; --side-active: #24574a;
    --st-received: #2d5f8a; --st-received-bg: #e3edf6;
    --st-repairing: #8a5a00; --st-repairing-bg: #fbf0d9;
    --st-center: #5a3f8f; --st-center-bg: #ece6f7;
    --st-quoted: #a4480f; --st-quoted-bg: #fbe5d6;
    --st-completed: #1f6b45; --st-completed-bg: #dcf1e5;
    --st-returned: #4b5751; --st-returned-bg: #e7ebe9;
    --st-cancelled: #9a3030; --st-cancelled-bg: #f7e1e1;
    --danger: #a33030; --danger-bg: #f9e4e4;
    --font: "Be Vietnam Pro", system-ui, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1412; --surface: #171e1b; --surface-2: #1c2521; --text: #e2e9e5; --muted: #95a59c;
      --border: #2a3530; --accent: #6fbf9d; --accent-ink: #0f1412; --accent-soft: #1d2f28;
      --side: #0b100e; --side-text: #cfdcd5; --side-muted: #7d9488; --side-active: #1d3a31;
      --st-received: #8fbfe6; --st-received-bg: #1a2a38;
      --st-repairing: #f0c26a; --st-repairing-bg: #332812;
      --st-center: #c2a8f0; --st-center-bg: #2a2140;
      --st-quoted: #f5a877; --st-quoted-bg: #3a2416;
      --st-completed: #7fd3a4; --st-completed-bg: #173226;
      --st-returned: #b3c0b9; --st-returned-bg: #252d29;
      --st-cancelled: #ef9a9a; --st-cancelled-bg: #3a1c1c;
      --danger: #ef9a9a; --danger-bg: #3a1c1c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1412; --surface: #171e1b; --surface-2: #1c2521; --text: #e2e9e5; --muted: #95a59c;
    --border: #2a3530; --accent: #6fbf9d; --accent-ink: #0f1412; --accent-soft: #1d2f28;
    --side: #0b100e; --side-text: #cfdcd5; --side-muted: #7d9488; --side-active: #1d3a31;
    --st-received: #8fbfe6; --st-received-bg: #1a2a38;
    --st-repairing: #f0c26a; --st-repairing-bg: #332812;
    --st-center: #c2a8f0; --st-center-bg: #2a2140;
    --st-quoted: #f5a877; --st-quoted-bg: #3a2416;
    --st-completed: #7fd3a4; --st-completed-bg: #173226;
    --st-returned: #b3c0b9; --st-returned-bg: #252d29;
    --st-cancelled: #ef9a9a; --st-cancelled-bg: #3a1c1c;
    --danger: #ef9a9a; --danger-bg: #3a1c1c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 236px 1fr; min-height: 100%; }
  aside { background: var(--side); color: var(--side-text); padding: 24px 14px; display: flex; flex-direction: column; gap: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand .logo { width: 34px; height: 34px; border: 1px solid var(--side-muted); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .brand b { letter-spacing: .2em; font-size: 13px; }
  .brand small { display: block; color: var(--side-muted); font-size: 11px; letter-spacing: .04em; }
  nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { color: var(--side-muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 12px 10px 4px; }
  nav button { background: none; border: 0; text-align: left; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--side-text); display: flex; justify-content: space-between; gap: 8px; }
  nav button:hover { background: var(--side-active); }
  nav button[aria-current="true"] { background: var(--side-active); color: #fff; font-weight: 600; }
  nav button code { font: 11px var(--mono); color: var(--side-muted); }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--side-muted); padding: 0 8px; display: grid; gap: 8px; }
  .side-foot button { background: none; border: 1px solid var(--side-muted); color: var(--side-text); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  main { min-width: 0; padding-block: 24px 64px; padding-inline: 28px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  h1 + p { margin: 2px 0 0; color: var(--muted); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .ctx { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .ctx label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; min-width: 0; }
  textarea { resize: vertical; min-height: 60px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 6px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border); font-weight: 500; }
  .btn.danger { background: var(--surface); color: var(--danger); border-color: var(--danger); }
  .btn.sm { padding: 3px 10px; font-size: 13px; }
  .btn[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  .panel-pad { padding: 16px; }
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; background: var(--surface-2); }
  th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
  td.wrap { white-space: normal; min-width: 180px; }
  td.num, th.num { text-align: right; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--accent-soft); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .tno { font-family: var(--mono); font-weight: 600; color: var(--accent); }
  .muted { color: var(--muted); }
  .null { color: var(--muted); font-style: italic; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st-received { color: var(--st-received); background: var(--st-received-bg); }
  .st-repairing { color: var(--st-repairing); background: var(--st-repairing-bg); }
  .st-center { color: var(--st-center); background: var(--st-center-bg); }
  .st-quoted { color: var(--st-quoted); background: var(--st-quoted-bg); }
  .st-completed { color: var(--st-completed); background: var(--st-completed-bg); }
  .st-returned { color: var(--st-returned); background: var(--st-returned-bg); }
  .st-cancelled { color: var(--st-cancelled); background: var(--st-cancelled-bg); }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .tag.fee { border-color: var(--st-quoted); color: var(--st-quoted); }
  .tag.k-onsite { border-color: var(--st-center); color: var(--st-center); }
  .tag.k-carry_in { border-color: var(--st-received); color: var(--st-received); }
  .tag.k-repair { border-color: var(--st-repairing); color: var(--st-repairing); }
  .tag.k-onsite_sangy { border-color: var(--st-center); color: var(--st-center); background: var(--st-center-bg); }
  .seg button:disabled { opacity: .4; cursor: not-allowed; }
  .wcell { display: grid; gap: 3px; justify-items: start; min-width: 190px; white-space: normal; }
  .wbar { display: block; width: 160px; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
  .wbar i { display: block; height: 100%; border-radius: 3px; background: var(--st-completed); }
  .wbar-expiring i { background: var(--st-repairing); }
  .toolbar select { max-width: 240px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .grow { flex: 1 1 240px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; display: grid; min-width: 96px; text-align: left; }
  .chip b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .chip span { font-size: 12px; color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field { display: grid; gap: 4px; align-content: start; }
  .field > span { font-size: 12px; font-weight: 600; }
  .field > span i { font-style: normal; font-weight: 400; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .hint.warn { color: var(--st-repairing); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .inline-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .inline-form > * { flex: 1 1 110px; }
  .inline-form > .btn { flex: 0 0 auto; }
  .err { background: var(--danger-bg); color: var(--danger); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
  .err:empty { display: none; }
  .section-title { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
  dialog { border: 1px solid var(--border); border-radius: 10px; padding: 0; width: min(820px, calc(100% - 32px)); background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgb(10 20 16 / .5); }
  .dlg-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { margin: 0; font-size: 17px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dlg-body { padding: 14px 20px 20px; max-height: 72vh; overflow-y: auto; }
  .dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 10px 10px; }
  .dlg-foot .spacer { flex: 1; }
  .x { background: none; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; margin: 0; }
  .kv div { display: grid; }
  .kv dt { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .kv dd { margin: 0; font-weight: 500; }
  .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 10px; }
  .timeline li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
  .box { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; background: var(--surface-2); }
  .action-box { border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
  .toast { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 10; }
  .demo-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .flow .step { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; }
  .flow .arrow { color: var(--muted); }
  .flow .end { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .flow .branch { font-size: 12px; color: var(--muted); }
  /* báo cáo */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
  .kpi .lbl { font-size: 12px; color: var(--muted); }
  .kpi .val { font-size: 24px; font-weight: 600; line-height: 1.25; }
  .kpi .sub { font-size: 12px; color: var(--muted); }
  .rep-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; align-items: start; margin-top: 16px; }
  .rep-grid .wide { grid-column: 1 / -1; }
  .rep-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; padding: 14px 16px 8px; }
  .rep-head h2 { margin: 0; }
  .rep-head p { margin: 0; font-size: 12px; color: var(--muted); }
  tr.total td { font-weight: 600; background: var(--surface-2); }
  .meter { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--accent-soft); vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .sev::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .sev-ok { color: var(--st-completed); } .sev-warn { color: var(--st-repairing); } .sev-bad { color: var(--st-cancelled); }
  .chart-wrap { position: relative; padding: 0 16px 12px; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart-wrap .hit { cursor: default; outline: none; }
  .chart-wrap .hit:focus-visible { stroke: var(--accent); stroke-width: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; transform: translate(-50%, calc(-100% - 8px)); white-space: nowrap; }
  .tip b { font-weight: 600; }
  details.tbl-view { padding: 0 16px 14px; font-size: 13px; }
  details.tbl-view summary { cursor: pointer; color: var(--muted); }
  /* chứng từ, báo giá, bảo hành */
  .attach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .attach { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface-2); min-width: 0; }
  .attach .meta { display: grid; min-width: 0; font-size: 12px; }
  .attach .meta span { overflow-wrap: anywhere; }
  .thumb { width: 56px; height: 56px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); padding: 0; overflow: hidden; cursor: zoom-in; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.file { display: grid; place-items: center; font: 600 11px var(--mono); color: var(--muted); cursor: default; }
  .x.sm { font-size: 16px; padding: 2px 6px; border-radius: 4px; }
  .x.armed { font-size: 12px; color: var(--danger); border: 1px solid var(--danger); }
  .quote { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 8px; }
  .quote.old { opacity: .7; }
  .w-head { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; align-items: flex-start; }
  .w-state { display: grid; gap: 6px; justify-items: start; max-width: 340px; }
  .w-state .pill { font-size: 14px; padding: 3px 12px; }
  #dlg2 { width: min(900px, calc(100% - 32px)); }
  /* phiếu in */
  .slip-wrap { background: #e9ece9; padding: 16px; border-radius: 8px; overflow-x: auto; }
  .slip { background: #fff; color: #111; font: 14px/1.45 "Tinos", "Times New Roman", serif; padding: 28px 32px; width: 720px; max-width: none; margin: 0 auto; box-shadow: 0 1px 4px rgb(0 0 0 / .15); }
  .slip .head { display: flex; gap: 16px; align-items: center; border-bottom: 1.5px solid #111; padding-bottom: 10px; }
  .slip .logo { width: 64px; height: 64px; border: 2px solid #1f4a3d; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 "Be Vietnam Pro", sans-serif; color: #1f4a3d; letter-spacing: .04em; flex: none; }
  .slip .co b { font-size: 16px; text-transform: uppercase; }
  .slip .co div { font-size: 13px; }
  .slip h3 { text-align: center; font-size: 20px; margin: 16px 0 2px; text-transform: uppercase; letter-spacing: .02em; }
  .slip .meta-c { text-align: center; font-size: 13px; margin-bottom: 12px; }
  .slip .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; margin-bottom: 10px; }
  .slip table { font-size: 13px; margin-top: 6px; }
  .slip th, .slip td { border: 1px solid #111; padding: 5px 7px; white-space: normal; color: #111; background: #fff; text-transform: none; letter-spacing: 0; font-size: 13px; }
  .slip th { font-weight: 700; text-align: center; }
  .slip .total td { font-weight: 700; }
  .slip .sign { display: grid; grid-template-columns: 1fr 1fr; text-align: center; margin-top: 22px; min-height: 110px; }
  .slip .sign b { display: block; text-transform: uppercase; }
  .slip .sign i { font-size: 12px; }
  .slip .sign .name { margin-top: 56px; font-weight: 700; }

  @media print {
    body { background: #fff; }
    .app, dialog, .toast { display: none !important; }
    #print-area { display: block !important; }
    #print-area .slip { box-shadow: none; width: auto; padding: 0; }
    @page { size: A4; margin: 14mm; }
  }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { padding: 12px 16px; gap: 10px; }
    nav { flex-direction: row; overflow-x: auto; }
    nav button { white-space: nowrap; }
    nav button code, .nav-label, .side-foot small { display: none; }
    .side-foot { flex-direction: row; display: flex; padding: 0; }
    main { padding-inline: 16px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>

<div class="app">
  <aside>
    <div class="brand"><div class="logo">SY</div><div><b>RMA</b><small>Sang Y · bản demo</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <small>Dữ liệu demo lưu trong trình duyệt của bạn.</small>
      <button type="button" id="reset-btn">Khôi phục dữ liệu mẫu</button>

  <main>
    <header class="top">
      <div><h1 id="page-title"></h1><p id="page-sub"></p></div>

</div>
<dialog id="dlg"><div id="dlg-inner"></div></dialog>
<dialog id="dlg2"><div id="dlg2-inner"></div></dialog>
<div id="print-area"></div>
<div class="toast" id="toast" hidden></div>

<script>
const STORE_KEY = 'rma-demo-v10';
const COMPANY = { name: 'Công ty TNHH Dịch Vụ và Kỹ Thuật Sang Y', short: 'SANG Y', address: 'Số 303 Lê Duẩn, Kiến An, Hải Phòng', phone: '……………', email: '……………' };

function addDays(d, n) { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function addMonths(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1 + n, dd)).toISOString().slice(0, 10); }
const daysBetween = (a, b) => Math.round((Date.parse(b.slice(0, 10)) - Date.parse(a.slice(0, 10))) / 86400000);
const fileSize = (b) => b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.round(b / 1024) + ' KB';

function deviceInfo(deviceId) { const d = byId('devices', deviceId); return { d, ...modelInfo(d?.product_model_id) }; }

// ---------- bảo hành sau sửa chữa ----------
function deviceChain(deviceId) {
  const chain = []; let d = byId('devices', deviceId);
  while (d && !chain.includes(d)) { chain.push(d); d = byId('devices', d.replaced_from_device_id); }
  return chain;
}
const repairWarrantyEnd = (t) => t.repair_warranty_months && t.returned_date ? addMonths(t.returned_date, t.repair_warranty_months) : null;
const warrantyLabel = (t) => t.repair_warranty_months ? `${t.repair_warranty_months} tháng${repairWarrantyEnd(t) ? ' · đến ' + dmy(repairWarrantyEnd(t)) : ' · tính từ ngày trả'}` : 'Không bảo hành';
/** Phiếu sửa chữa gần nhất của máy còn trong thời gian bảo hành sau sửa (chỉ để nhắc, không tự quyết định loại phiếu). */
function activeRepairWarranty(deviceId) {
  const ids = deviceChain(deviceId).map(d => d.id);
  return db.rma_tickets.filter(t => (ids.includes(t.device_id) || ids.includes(t.returned_device_id)) && repairWarrantyEnd(t) && repairWarrantyEnd(t) >= db.today)
    .sort((a, b) => repairWarrantyEnd(b).localeCompare(repairWarrantyEnd(a)))[0] || null;
}

// ---------- cấp số phiếu ----------
const periodNow = () => db.today.slice(2, 4) + db.today.slice(5, 7);
function peekTicketNo() { const seq = db.ticket_sequences.find(s => s.period === periodNow()); return periodNow() + String((seq ? seq.last_number : 0) + 1).padStart(4, '0'); }
function takeTicketNo() {
  const period = periodNow();
  let seq = db.ticket_sequences.find(s => s.ticket_type === 'RMA' && s.period === period);
  if (!seq) { seq = { ticket_type: 'RMA', period, last_number: 0 }; db.ticket_sequences.push(seq); }
  if (seq.last_number >= 9999) throw new Error('Đã hết số phiếu của tháng ' + period + ' (tối đa 9999).');
  seq.last_number++;
  return period + String(seq.last_number).padStart(4, '0');
}
function findOrCreateDevice(modelId, serial, replacedFrom = null) {
  const d = db.devices.find(x => x.product_model_id === Number(modelId) && x.serial_number.toLowerCase() === serial.toLowerCase());
  return d || insert('devices', { product_model_id: Number(modelId), serial_number: serial, replaced_from_device_id: replacedFrom });
}
function swapSerial(t, serial, modelId) {
  serial = (serial || '').trim(); if (!serial) return false;
  const cur = byId('devices', t.device_id);
  const model = Number(modelId) || cur.product_model_id;
  if (model === cur.product_model_id && serial.toLowerCase() === cur.serial_number.toLowerCase()) return false;
  t.returned_device_id = findOrCreateDevice(model, serial, cur.id).id;
  return true;
}
/** Hãng đổi sang sản phẩm khác thì bắt buộc phải có serial của máy mới. */

const isDifferentProduct = (t) => { const a = byId('devices', t.device_id); const b = byId('devices', t.returned_device_id); return !!b && a.product_model_id !== b.product_model_id; };

const EXPIRING_DAYS = 15;

/** Everything the device page needs about one machine, derived from its tickets. */
function deviceSummary(d) {
  const ids = deviceChain(d.id).map(x => x.id);
  const tickets = db.rma_tickets.filter(t => ids.includes(t.device_id) || ids.includes(t.returned_device_id))
    .sort((a, b) => b.received_date.localeCompare(a.received_date) || b.ticket_no.localeCompare(a.ticket_no));
  const last = tickets[0] || null;
  const customerIds = [...new Set(tickets.map(t => t.customer_id))];
  const replacements = db.devices.filter(x => x.replaced_from_device_id === d.id);
  return {
    d, i: modelInfo(d.product_model_id), tickets, last,
    customer: last ? byId('customers', last.customer_id) : null, customerIds,
    open: tickets.find(t => !isClosed(t)) || null,
    rw: repairWarrantyState(tickets),
    replacedFrom: byId('devices', d.replaced_from_device_id), replacements,
  };
}
/** Bảo hành sau sửa của lần sửa gần nhất có nhập thời gian bảo hành. */
function repairWarrantyState(tickets) {
  const t = tickets.filter(x => x.service_type === 'repair' && x.repair_warranty_months && x.returned_date)
    .sort((a, b) => repairWarrantyEnd(b).localeCompare(repairWarrantyEnd(a)))[0];
  if (!t) return { level: 'none', label: 'Chưa có', cls: 'returned' };
  const end = repairWarrantyEnd(t); const left = daysBetween(db.today, end); const total = daysBetween(t.returned_date, end);
  if (left < 0) return { level: 'expired', label: 'Đã hết', cls: 'cancelled', t, end, left, total };
  if (left <= EXPIRING_DAYS) return { level: 'expiring', label: `Sắp hết · còn ${left} ngày`, cls: 'repairing', t, end, left, total };
  return { level: 'active', label: `Còn ${left} ngày`, cls: 'completed', t, end, left, total };
}
function warrantyCell(rw) {
  if (rw.level === 'none') return '<span class="muted">Chưa có BH sửa chữa</span>';
  const pct = rw.level === 'expired' ? 0 : Math.max(4, Math.round(rw.left / Math.max(1, rw.total) * 100));
  return `<div class="wcell"><span class="pill st-${rw.cls}">${rw.label}</span>
    ${rw.level === 'expired' ? '' : `<span class="wbar wbar-${rw.level}"><i style="width:${pct}%"></i></span>`}
    <span class="hint">${rw.t.repair_warranty_months} tháng · ${rw.level === 'expired' ? 'hết' : 'đến'} ${dmy(rw.end)}</span><span class="hint">theo phiếu <span class="tno">${rw.t.ticket_no}</span></span></div>`;
}

  $('#ctx-date').value = db.today;
  const p = PAGES.find(x => x.id === page);
  $('#page-title').textContent = p.label; $('#page-sub').textContent = p.sub;

}

function wireAttachments(root, after) {
  $$('[data-attach]', root).forEach(f => f.addEventListener('submit', (e) => {
    e.preventDefault(); const ticketId = Number(f.dataset.attach); const file = f.file.files[0]; if (!file) return;
    if (file.size > MAX_FILE) { toast('Bản demo chỉ nhận tệp tối đa 1,5 MB. Hệ thống thật cho tới 10 MB.'); return; }
    const rd = new FileReader();
    rd.onload = () => {
      const a = insert('attachments', { rma_ticket_id: ticketId, doc_type: f.doc_type.value, file_name: file.name, mime_type: file.type || 'application/octet-stream',
        size_bytes: file.size, data_url: rd.result, uploaded_by: db.currentUserId, created_at: nowTs() });
      if (!save()) { db.attachments = db.attachments.filter(x => x !== a); toast('Bộ nhớ trình duyệt đã đầy, không lưu được tệp. Xoá bớt chứng từ cũ rồi thử lại.'); return; }
      toast('Đã tải lên ' + file.name); after();
    };
    rd.readAsDataURL(file);
  }));
  $$('[data-delattach]', root).forEach(b => b.addEventListener('click', () => {
    if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Xoá?'; b.classList.add('armed'); return; }
    db.attachments = db.attachments.filter(a => a.id !== Number(b.dataset.delattach)); save(); after();
  }));
  $$('[data-view]', root).forEach(b => b.addEventListener('click', () => {
    const a = byId('attachments', b.dataset.view);
    $('#dlg2-inner').innerHTML = `<div class="dlg-head"><div><h2>${esc(DOCTYPE[a.doc_type])}</h2><div class="muted mono">${esc(a.file_name)}</div></div><button type="button" class="x" data-close2 aria-label="Đóng">×</button></div>
      <div class="dlg-body" style="text-align:center"><img src="${a.data_url}" alt="${esc(a.file_name)}" style="max-width:100%"></div>`;
    $('#dlg2').showModal();
  }));
}

function monthChart(months) {

      g += `<path d="M${x},${y0} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y0} Z" fill="var(--accent)" opacity="${m.inPeriod ? 1 : .35}"/>`; }

    g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.label}</text>`;
    g += `<rect class="hit" data-i="${n}" x="${L + band * n}" y="${TOP}" width="${band}" height="${ph}" fill="transparent" tabindex="0" aria-label="${m.label}: ${m.total} phiếu"/>`;
  });

}

function exportReport() {

    add('Tổng quan', [...head('BÁO CÁO TỔNG HỢP RMA'), ...r.kpis.map(k => [k.lbl, k.val, k.sub]), [], ['Phiếu nhận theo tháng'], ['Tháng', ...ALL.map(k => KIND[k].short), 'Tổng'], ...r.months.map(m => [m.label, ...m.byKind.map(([, n]) => n), m.total])], [28, 18, 40, 10, 10]);
    for (const s of r.sections) add(s.title.replace(/[\\/?*[\]:()]/g, ''), [...head(s.title.toUpperCase()), [s.note.replace(' · bấm dòng để mở phiếu', '')], s.cols.map(c => c[0]), ...s.rows.map(row => row.cells.map((v, n) => cellXlsx(s.cols[n][1], v)))], s.cols.map(c => c[1] === 'text' ? 26 : 14));
    const list = r.received.sort((a, b) => a.ticket_no.localeCompare(b.ticket_no)).map(t => { const i = deviceInfo(t.device_id); const rd = deviceInfo(t.returned_device_id); const c = byId('customers', t.customer_id); const ls = lastShipment(t);
      return [t.ticket_no, KIND[kindOf(t)].label, STATUS[t.status].label, c.name, c.contact_name || '', c.phone, productName(i), i.d.serial_number, rd.d ? rd.d.serial_number + (isDifferentProduct(t) ? ' (' + productName(rd) + ')' : '') : '', byId('users', t.technician_id)?.name || '',
        dmy(t.received_date), dmy(t.returned_date), RESULT[t.result] || '', t.charge_amount || '', t.erp_receipt_no || '', t.erp_return_no || '', ls ? byId('service_centers', ls.service_center_id)?.name : '', ls?.vendor_case_no || '', shipmentsOf(t).length]; });
    add('Danh sách phiếu', [...head('DANH SÁCH PHIẾU NHẬN TRONG KỲ'), ['Số phiếu', 'Loại', 'Trạng thái', 'Khách hàng', 'Người liên hệ', 'SĐT', 'Thiết bị', 'Serial nhận', 'Serial trả', 'IT phụ trách', 'Ngày nhận', 'Ngày trả', 'Kết quả', 'Số tiền', 'V223', 'V233', 'Hãng/TTBH', 'Mã hồ sơ hãng', 'Số lần gửi TTBH'], ...list],
      [11, 16, 16, 26, 16, 14, 30, 20, 20, 16, 11, 11, 30, 12, 14, 14, 24, 16, 10]);
    XLSX.writeFile(wb, `BaoCao_RMA_${rep.from}_${rep.to}.xlsx`);
  } catch (e) { toast('Không tạo được file Excel: ' + e.message); }
}

const findType = (name) => { const n = name.trim().toLowerCase(); return n ? db.device_types.find(t => t.name.toLowerCase() === n) : null; };
const findBrand = (name) => { const n = name.trim().toUpperCase(); return n ? db.brands.find(b => b.name === n) : null; };
function typeCode(name) {
  const base = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'D').toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 25) || 'TYPE';
  let code = base; for (let n = 2; db.device_types.some(t => t.code === code); n++) code = base + '_' + n;
  return code;
}

    const t = insert('rma_tickets', { ticket_no: ticketNo, service_type: serviceType, original_service_type: serviceType, onsite_location: onsite ? (kind === 'onsite_sangy' ? 'sangy' : 'customer') : null,
      warranty_status: ws, repair_warranty_months: null, customer_id: customerId, device_id: dev.id, returned_device_id: null,
      technician_id: Number(v('#nt-tech')) || null, fault_description: v('#nt-fault'), accessories: kind === 'onsite' ? null : (v('#nt-acc') || null), received_date: v('#nt-date'), returned_date: null,
      status: onsite ? 'scheduled' : 'received', result: null, scrap_reason: null, is_chargeable: false, charge_amount: null, quote_status: null, quoted_at: null, quote_decided_at: null,
      erp_receipt_no: null, erp_return_no: null, note: null, created_by: db.currentUserId, deleted_at: null, created_at: ts, updated_at: ts });
    if (onsite) insert('rma_center_shipments', { rma_ticket_id: t.id, service_center_id: Number(v('#nt-center')), vendor_case_no: v('#nt-case') || null, appointment_date: v('#nt-appt') || null,
      sent_date: v('#nt-date'), back_date: null, center_return_no: null, outcome: 'pending', note: null, created_by: db.currentUserId });
    insert('rma_ticket_status_logs', { rma_ticket_id: t.id, from_status: null, to_status: t.status, user_id: db.currentUserId, note: null, created_at: ts });
    save(); filter = { kind: '', status: '', q: '' }; page = 'tickets'; render(); ticketDialog(t.id); toast('Đã lập phiếu ' + ticketNo);
  });
}

function fieldInput(f, t) {
  const id = 'af-' + f.key; const def = f.def ? (f.def(t) ?? '') : '';
  const label = `<span>${esc(f.label)}${f.required ? ' *' : ' <i>(tuỳ chọn)</i>'}</span>`;
  if (f.type === 'center') { const cur = lastShipment(t)?.service_center_id;
    return `<label class="field">${label}<select id="${id}"><option value="">Chọn…</option>${db.service_centers.filter(s => s.is_active).map(s => `<option value="${s.id}" ${s.id === cur ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>`; }
  if (f.type === 'date') return `<label class="field">${label}<input type="date" id="${id}" value="${esc(def)}"></label>`;
  if (f.type === 'model') {
    const cur = modelInfo(byId('devices', t.device_id).product_model_id);
    const groups = db.device_types.filter(ty => ty.is_active).map(ty => {
      const ms = db.product_models.filter(m => m.is_active && m.device_type_id === ty.id);
      return ms.length ? `<optgroup label="${esc(ty.name)}">${ms.map(m => `<option value="${m.id}">${esc(byId('brands', m.brand_id).name)} ${esc(m.code)}</option>`).join('')}</optgroup>` : '';
    }).join('');
    return `<label class="field">${label}<select id="${id}"><option value="">Cùng model máy cũ (${esc(cur.b.name)} ${esc(cur.m.code)})</option>${groups}</select></label>`;
  }
  if (f.type === 'number') return `<label class="field full">${label}<input type="number" id="${id}" min="1" max="60" step="1" placeholder="VD: 3" style="max-width:160px"></label>`;
  return `<label class="field ${f.key === 'note' ? 'full' : ''}">${label}<input id="${id}" value="${esc(def)}"></label>`;
}

}

function buildSlip(type, t) {

  const staff = isReturn ? byId('users', db.currentUserId) : (byId('users', t.technician_id) || byId('users', t.created_by));

  const row = isReturn ? [1, name, 1, serialIn, isDifferentProduct(t) ? `${serialOut} (${productName(r)})` : serialOut, RESULT[t.result] || ''] : [1, name, 1, serialIn, t.fault_description, t.accessories || 'Không'];
  const swapLine = isReturn && r.d ? `Hãng đã đổi ${isDifferentProduct(t) ? 'sang sản phẩm khác' : 'máy mới cùng model'}: ${productName(r)}, serial ${r.d.serial_number}.` : '';
  const html = `<div class="slip">
    <div class="head"><div class="logo">${COMPANY.short}</div><div class="co"><b>${esc(COMPANY.name)}</b><div>ĐC: ${esc(COMPANY.address)}</div><div>Tel: ${esc(COMPANY.phone)} · Email: ${esc(COMPANY.email)}</div></div></div>

      <div>Người liên hệ: ${esc(c.contact_name) || '……………………'}</div><div>Địa chỉ: ${esc(c.address) || '……………………………'}</div>
      <div>Loại: ${KIND[k].label}</div><div>Tình trạng bảo hành: ${WARRANTY[t.warranty_status]}</div>${isReturn ? `<div>Ngày nhận: ${dmy(t.received_date)}</div>` : ''}
    </div>
    <table><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead>

    ${swapLine ? `<p>${esc(swapLine)}</p>` : ''}
    ${t.scrap_reason && isReturn ? `<p>Lý do báo phế: ${esc(t.scrap_reason)}</p>` : ''}
    ${lines.length ? `<table><thead><tr><th>STT</th><th>Nội dung sửa chữa</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>
      ${lines.map((p, n) => `<tr><td style="text-align:center">${n + 1}</td><td>${esc(p.description)}</td><td style="text-align:center">${p.quantity}</td><td style="text-align:right">${money(p.unit_price)}</td><td style="text-align:right">${money(p.quantity * p.unit_price)}</td></tr>`).join('')}

  </div>`;
  const aoa = [[COMPANY.name.toUpperCase()], ['ĐC: ' + COMPANY.address], ['Tel: ' + COMPANY.phone + ' · Email: ' + COMPANY.email], [],
    [title.toUpperCase()], ['Số phiếu: ' + t.ticket_no + '   Ngày ' + dmy(date)], [],
    ['Khách hàng:', c.name, '', 'Điện thoại:', c.phone], ['Người liên hệ:', c.contact_name || '', '', 'Địa chỉ:', c.address || ''], ['Loại:', KIND[k].label, '', 'Tình trạng BH:', WARRANTY[t.warranty_status]], [], head, row];
  if (swapLine) aoa.push([], [swapLine]);
  if (t.scrap_reason && isReturn) aoa.push([], ['Lý do báo phế:', t.scrap_reason]);
  if (lines.length) { aoa.push([], ['STT', 'Nội dung sửa chữa', 'SL', 'Đơn giá', 'Thành tiền']); lines.forEach((p, n) => aoa.push([n + 1, p.description, p.quantity, p.unit_price, p.quantity * p.unit_price])); aoa.push(['', '', '', 'Tổng cộng', t.charge_amount]); }
  if (isReturn && !t.is_chargeable) aoa.push([], ['Chi phí:', 'Miễn phí']);
  if (wLine) aoa.push([], [wLine]);
  aoa.push([], [], ['', 'KHÁCH HÀNG', '', '', isReturn ? 'NHÂN VIÊN TRẢ' : 'NHÂN VIÊN NHẬN'], ['', '(Ký, ghi rõ họ tên)', '', '', '(Ký, ghi rõ họ tên)'], [], [], ['', '', '', '', staff?.name || '']);
  return { html, aoa, file: (isReturn ? 'PhieuTra_' : 'PhieuNhan_') + t.ticket_no, title };
}
function slipDialog(type, id) {
  const t = byId('rma_tickets', id); const s = buildSlip(type, t);
  openDialog(`
    <div class="dlg-head"><div><h2>${s.title} · <span class="tno">${t.ticket_no}</span></h2><div class="muted">Xem trước khi in hoặc xuất file</div></div><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
    <div class="dlg-body"><div class="slip-wrap">${s.html}</div>
      <p class="hint" style="margin-top:10px">Nút "In / Lưu PDF" và "Tải Excel" chỉ chạy khi mở file <span class="mono">rma-demo.html</span> trực tiếp trên máy (cần mạng để tải thư viện Excel). Trên link claude.ai, trình xem chặn in và tải file.</p>
      <div class="err" id="slip-err"></div></div>
    <div class="dlg-foot"><button type="button" class="btn ghost" data-back="${t.id}">← Quay lại phiếu</button><span class="spacer"></span>
      <button type="button" class="btn ghost" id="slip-xlsx">Tải Excel</button><button type="button" class="btn" id="slip-print">In / Lưu PDF</button></div>`);
  $('#slip-print').addEventListener('click', () => { $('#print-area').innerHTML = s.html; try { window.print(); } catch (e) {} });
  $('#slip-xlsx').addEventListener('click', () => {
    if (typeof XLSX === 'undefined') { $('#slip-err').textContent = 'Chưa tải được thư viện Excel. Kiểm tra kết nối mạng rồi mở lại trang.'; return; }
    try { const ws = XLSX.utils.aoa_to_sheet(s.aoa); ws['!cols'] = [{ wch: 14 }, { wch: 34 }, { wch: 6 }, { wch: 22 }, { wch: 26 }, { wch: 30 }];
      ws['!merges'] = [0, 1, 2, 4, 5].map(rw => ({ s: { r: rw, c: 0 }, e: { r: rw, c: 5 } }));
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, t.ticket_no); XLSX.writeFile(wb, s.file + '.xlsx');
    } catch (e) { $('#slip-err').textContent = 'Không tạo được file Excel: ' + e.message; }
  });
}

// ---------- sự kiện ----------
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-preset],[data-rkind],#rp-xlsx,[data-page],[data-kind],[data-status],[data-ticket],[data-close],[data-close2],[data-toggle],[data-raw],[data-slip],[data-back],[data-dev],[data-devchip],[data-cust-devices],[data-newfor],#new-ticket,#reset-btn');
  if (!el) return;
  if (el.dataset.preset) { setPreset(el.dataset.preset); render(); }
  else if (el.hasAttribute('data-rkind')) { rep.kind = el.dataset.rkind; render(); }
  else if (el.id === 'rp-xlsx') exportReport();
  else if (el.dataset.page) { page = el.dataset.page; render(); }
  else if (el.hasAttribute('data-kind')) { filter.kind = el.dataset.kind; filter.status = ''; render(); }
  else if (el.hasAttribute('data-status')) { filter.status = el.dataset.status; render(); }
  else if (el.dataset.ticket) ticketDialog(el.dataset.ticket);
  else if (el.hasAttribute('data-close')) dlg.close();
  else if (el.hasAttribute('data-close2')) $('#dlg2').close();
  else if (el.dataset.raw) { VIEWS.raw.cur = el.dataset.raw; render(); }
  else if (el.dataset.slip) { const [type, id] = el.dataset.slip.split(':'); slipDialog(type, id); }
  else if (el.dataset.back) ticketDialog(el.dataset.back);
  else if (el.dataset.toggle) { const [tb, id] = el.dataset.toggle.split(':'); const r = byId(tb, id); r.is_active = !r.is_active; save(); render(); }
  else if (el.dataset.dev) deviceDialog(el.dataset.dev);
  else if (el.hasAttribute('data-devchip')) { devFilter.chip = el.dataset.devchip; render(); }
  else if (el.dataset.custDevices) { devFilter = { q: '', chip: '', customer: el.dataset.custDevices, sort: 'recent' }; page = 'devices'; render(); }
  else if (el.dataset.newfor) { const x = deviceSummary(byId('devices', el.dataset.newfor)); newTicketDialog({ serial: x.d.serial_number, customerId: x.customer?.id }); }
  else if (el.id === 'new-ticket') newTicketDialog();
  else if (el.id === 'reset-btn') {
    if (el.dataset.armed) { db = seed(); save(); page = 'tickets'; filter = { kind: '', status: '', q: '' }; devFilter = { q: '', chip: '', customer: '', sort: 'recent' }; render(); toast('Đã khôi phục dữ liệu mẫu'); }
    else { el.dataset.armed = '1'; el.textContent = 'Bấm lần nữa để xác nhận'; setTimeout(() => { delete el.dataset.armed; el.textContent = 'Khôi phục dữ liệu mẫu'; }, 3000); }
  }
});
document.addEventListener('input', (e) => {
  const keep = (id) => { const pos = e.target.selectionStart; render(); const s = $('#' + id); s.focus(); s.setSelectionRange(pos, pos); };
  if (e.target.id === 't-search') { filter.q = e.target.value; keep('t-search'); }
  else if (e.target.id === 'dv-search') { devFilter.q = e.target.value; keep('dv-search'); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'dv-customer') { devFilter.customer = e.target.value; render(); return; }
  if (e.target.id === 'dv-sort') { devFilter.sort = e.target.value; render(); return; }
  if (e.target.id === 'rp-from' || e.target.id === 'rp-to') {
    const v = e.target.value; if (!v) return;
    rep[e.target.id === 'rp-from' ? 'from' : 'to'] = v; rep.preset = '';
    if (rep.from > rep.to) [rep.from, rep.to] = [rep.to, rep.from];
    render();
  }
});
document.addEventListener('submit', (e) => {
  const f = e.target; const v = (s) => $(s).value.trim();
  const catErr = (m) => { const el = $('#cat-err'); if (el) el.textContent = m; };
  if (f.id === 'f-customer') { e.preventDefault(); insert('customers', { name: v('#c-name'), contact_name: v('#c-contact') || null, phone: v('#c-phone'), address: v('#c-address') || null, note: null }); save(); render(); toast('Đã thêm khách hàng'); }
  else if (f.id === 'f-center') { e.preventDefault(); insert('service_centers', { name: v('#sc-name'), brands: v('#sc-brands') || null, phone: v('#sc-phone') || null, address: v('#sc-address') || null, is_active: true }); save(); render(); toast('Đã thêm hãng / TTBH'); }
  else if (f.id === 'f-type') { e.preventDefault(); const code = v('#dt-code').toUpperCase();
    if (db.device_types.some(t => t.code === code)) return catErr('Mã loại thiết bị "' + code + '" đã có.');
    insert('device_types', { code, name: v('#dt-name'), is_active: true }); save(); render(); toast('Đã thêm loại thiết bị'); }
  else if (f.id === 'f-brand') { e.preventDefault(); const name = v('#b-name').toUpperCase();
    if (db.brands.some(b => b.name === name)) return catErr('Hãng "' + name + '" đã có.');
    insert('brands', { name, is_active: true }); save(); render(); toast('Đã thêm hãng'); }
  else if (f.id === 'f-model') { e.preventDefault(); const brand_id = Number(v('#m-brand')); const code = v('#m-code');
    if (db.product_models.some(m => m.brand_id === brand_id && m.code.toLowerCase() === code.toLowerCase())) return catErr('Model "' + code + '" của hãng này đã có.');
    insert('product_models', { brand_id, device_type_id: Number(v('#m-type')), code, name: v('#m-name') || null, is_active: true }); save(); render(); toast('Đã thêm model'); }
});
$('#ctx-user').addEventListener('change', (e) => { db.currentUserId = Number(e.target.value); save(); });
$('#ctx-date').addEventListener('change', (e) => { if (e.target.value) { db.today = e.target.value; save(); if (rep.preset) setPreset(rep.preset); render(); } });

load(); render();
</script>
